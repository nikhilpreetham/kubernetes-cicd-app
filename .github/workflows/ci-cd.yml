
name: Kubernetes Demo CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Stage 1: Application testing
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run application tests
        run: |
          python -m pytest tests/ -v

  # Stage 2: Docker build and publishing
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            nikhilpreetham/devops-demo:latest
            nikhilpreetham/devops-demo:${{ github.sha }}

  # Stage 3: Kubernetes deployment
  deploy:
    name: Deploy to Local Kubernetes
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: kubectl cluster-info

      - name: Verify Helm
        run: helm version

      - name: Deploy application using Helm
        shell: powershell
        run: |
          helm upgrade --install devops-demo ./helm/devops-demo `
            --namespace devops-demo `
            --set image.repository=nikhilpreetham/devops-demo `
            --set image.tag=${{ github.sha }} `
            --wait `
            --timeout 5m

      - name: Verify deployment rollout
        run: kubectl rollout status deployment/devops-demo -n devops-demo --timeout=180s
