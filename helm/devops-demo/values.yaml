replicaCount: 3

image:
  # The CI/CD pipeline overrides both values: repository and the commit SHA tag.
  repository: nikhilpreetham/devops-demo
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi